<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" fill="none">
  <!-- Main bubble/sphere -->
  <ellipse cx="148" cy="68" rx="54" ry="52" fill="#00C8E0"/>

  <!-- City/house silhouette inside the bubble (white) -->
  <!-- Left house -->
  <rect x="104" y="72" width="16" height="22" fill="white"/>
  <polygon points="104,72 112,58 120,72" fill="white"/>
  <!-- Door on house -->
  <rect x="109" y="82" width="6" height="12" fill="#00C8E0"/>
  <!-- Window on house -->
  <rect x="105" y="74" width="5" height="5" fill="#00C8E0"/>
  <rect x="113" y="74" width="5" height="5" fill="#00C8E0"/>

  <!-- Center tall building -->
  <rect x="122" y="60" width="14" height="34" fill="white"/>
  <!-- Windows on center building -->
  <rect x="124" y="63" width="3" height="3" fill="#00C8E0"/>
  <rect x="129" y="63" width="3" height="3" fill="#00C8E0"/>
  <rect x="124" y="70" width="3" height="3" fill="#00C8E0"/>
  <rect x="129" y="70" width="3" height="3" fill="#00C8E0"/>
  <rect x="124" y="77" width="3" height="3" fill="#00C8E0"/>
  <rect x="129" y="77" width="3" height="3" fill="#00C8E0"/>

  <!-- Right tall building -->
  <rect x="138" y="55" width="16" height="39" fill="white"/>
  <!-- Windows on right building -->
  <rect x="140" y="58" width="4" height="4" fill="#00C8E0"/>
  <rect x="148" y="58" width="4" height="4" fill="#00C8E0"/>
  <rect x="140" y="66" width="4" height="4" fill="#00C8E0"/>
  <rect x="148" y="66" width="4" height="4" fill="#00C8E0"/>
  <rect x="140" y="74" width="4" height="4" fill="#00C8E0"/>
  <rect x="148" y="74" width="4" height="4" fill="#00C8E0"/>

  <!-- Far right smaller building -->
  <rect x="156" y="65" width="12" height="29" fill="white"/>
  <rect x="158" y="68" width="3" height="3" fill="#00C8E0"/>
  <rect x="163" y="68" width="3" height="3" fill="#00C8E0"/>
  <rect x="158" y="75" width="3" height="3" fill="#00C8E0"/>
  <rect x="163" y="75" width="3" height="3" fill="#00C8E0"/>

  <!-- Ground line inside bubble -->
  <rect x="100" y="94" width="96" height="3" rx="1.5" fill="white" opacity="0.5"/>

  <!-- Foam / bubbles below sphere -->
  <!-- Large foam base -->
  <ellipse cx="148" cy="114" rx="44" ry="12" fill="#00C8E0"/>
  <!-- Foam bumps row 1 -->
  <circle cx="115" cy="108" r="10" fill="#00C8E0"/>
  <circle cx="128" cy="106" r="12" fill="#00C8E0"/>
  <circle cx="143" cy="104" r="13" fill="#00C8E0"/>
  <circle cx="158" cy="106" r="11" fill="#00C8E0"/>
  <circle cx="171" cy="109" r="9" fill="#00C8E0"/>
  <!-- Foam bumps row 2 (smaller) -->
  <circle cx="122" cy="116" r="7" fill="#00C8E0"/>
  <circle cx="136" cy="118" r="8" fill="#00C8E0"/>
  <circle cx="151" cy="117" r="8" fill="#00C8E0"/>
  <circle cx="164" cy="115" r="7" fill="#00C8E0"/>
  <!-- Scattered small bubbles -->
  <circle cx="106" cy="112" r="5" fill="#00C8E0"/>
  <circle cx="178" cy="112" r="6" fill="#00C8E0"/>
  <circle cx="185" cy="118" r="4" fill="#00C8E0"/>
  <circle cx="100" cy="118" r="4" fill="#00C8E0"/>

  <!-- Text: TruSteam -->
  <text x="12" y="155" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="36" fill="#00C8E0" letter-spacing="-0.5">TruSteam</text>
  <!-- Text: Cleaning -->
  <text x="12" y="192" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="36" fill="#00C8E0" letter-spacing="-0.5">Cleaning</text>
</svg>
